name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The whole solution is plain net8.0 and builds on Linux, Avalonia included, so the
      # checks run on a cheap runner. AuthGeek.Core carries the parts worth proving: the RFC
      # 4226 and RFC 6238 test vectors, base32, otpauth links, the Google transfer format, the
      # encrypted vault, and backup and restore. None of them touch Windows.
      - name: Build
        run: dotnet build AuthGeek.sln -c Release

      - name: Test
        run: dotnet run --project tests/AuthGeek.Tests -c Release --no-build

      # The checks above run against a build from source, where anything native sits in a
      # runtimes folder next to the assembly. The product does not ship that way: it ships as
      # one self-contained executable with everything bundled inside it, and some libraries
      # cannot find themselves in there. TranscribeGeek shipped two versions able to install
      # and unable to work because nothing ever ran the packaged shape.
      #
      # AuthGeek is managed code all the way down and so ought to be immune, but "ought to be"
      # is what the other one was too, so the harness is published exactly the way the product
      # is and run again.
      - name: Test the way it is actually packaged
        run: |
          dotnet publish tests/AuthGeek.Tests/AuthGeek.Tests.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/checks
          ./publish/checks/AuthGeek.Tests
